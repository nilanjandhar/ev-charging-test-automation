# The merge gate. Everything here blocks a merge, so everything here must be
# fast, hermetic and deterministic: no containers, no network, no wall clock.
# Target is under three minutes end to end.
name: PR gate

on:
  pull_request:
  workflow_dispatch:

# One in-flight run per branch. A PR that gets three pushes in a minute should
# burn one runner, not three.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Derandomised and bounded, so a red build is reproducible from the commit alone.
  HYPOTHESIS_PROFILE: ci

jobs:
  static:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            service/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check tests tools --output-format=github
          ruff format --check tests tools
      - name: mypy --strict
        run: mypy

  gate:
    name: unit + contract + api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            service/requirements.txt
      - run: pip install -r requirements-dev.txt

      # `not slow` drops the schemathesis fuzz suite: bounded fuzzing still takes
      # tens of seconds when it shrinks a failure, and it runs nightly instead.
      # Excluding by marker rather than by path means a slow test added to a fast
      # layer leaves the gate automatically.
      - name: pytest
        run: |
          pytest -m "not e2e and not perf and not ui and not slow" \
            --junitxml=reports/junit.xml \
            --cov --cov-report=xml:reports/coverage.xml --cov-report=term-missing

      # Built from the JUnit XML above, so it exists whether the run passed or
      # failed — a report you only get on green is useless at the moment you need
      # it. Downloadable from the artifact below; open test-report.html.
      - name: Build HTML report
        if: always()
        run: python tools/test_report.py

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn
