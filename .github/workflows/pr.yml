# The merge gate. Everything here blocks a merge, so everything here must be
# fast, hermetic and deterministic: no containers, no network, no wall clock.
# Target is under three minutes end to end.
name: PR gate

on:
  pull_request:
  workflow_dispatch:

# One in-flight run per branch. A PR that gets three pushes in a minute should
# burn one runner, not three.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Derandomised and bounded, so a red build is reproducible from the commit alone.
  HYPOTHESIS_PROFILE: ci

jobs:
  static:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            service/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check tests --output-format=github
          ruff format --check tests
      - name: mypy --strict
        run: mypy

  gate:
    name: unit + contract + api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            service/requirements.txt
      - run: pip install -r requirements-dev.txt

      # `not slow` drops the schemathesis fuzz suite: bounded fuzzing still takes
      # tens of seconds when it shrinks a failure, and it runs nightly instead.
      # Excluding by marker rather than by path means a slow test added to a fast
      # layer leaves the gate automatically.
      - name: pytest
        run: |
          pytest -m "not e2e and not perf and not ui and not slow" \
            --junitxml=reports/junit.xml \
            --cov --cov-report=xml:reports/coverage.xml --cov-report=term-missing

      - name: Job summary
        # Runs on failure too — a summary you only get when green is a summary
        # nobody reads at the moment they need it.
        if: always()
        run: |
          {
            echo "## PR gate"
            echo
            python - <<'PY'
          import xml.etree.ElementTree as ET, pathlib
          report = pathlib.Path("reports/junit.xml")
          if not report.exists():
              print("No JUnit report produced — the run failed before pytest started.")
              raise SystemExit
          suite = ET.parse(report).getroot().find("testsuite") or ET.parse(report).getroot()
          get = lambda key: int(suite.get(key, 0))
          total, failures, errors = get("tests"), get("failures"), get("errors")
          skipped, time_s = get("skipped"), float(suite.get("time", 0))
          print(f"| metric | value |\n| --- | --- |")
          print(f"| tests | {total} |")
          print(f"| failures | {failures} |")
          print(f"| errors | {errors} |")
          print(f"| skipped / xfailed | {skipped} |")
          print(f"| duration | {time_s:.1f}s |")
          print()
          if failures or errors:
              print("### Failures")
              for case in suite.iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      print(f"- `{case.get('classname')}::{case.get('name')}` — "
                            f"{(bad.get('message') or '').splitlines()[0][:200]}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn
