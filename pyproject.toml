[project]
name = "station-health-qa"
version = "1.0.0"
description = "Test automation suite for the NOC Station Health API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `service` is on the path so the in-process layers can import the ASGI app
# directly; `.` is on the path so `tests.helpers` resolves from any rootdir.
pythonpath = [".", "service"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--durations=10",
]
markers = [
    "unit: pure-function tests, no I/O, no app instance",
    "contract: response conformance against the service's own /openapi.json",
    "api: in-process integration through the ASGI app with an isolated database",
    "e2e: live HTTP against a running service (docker compose); needs BASE_URL",
    "perf: latency/concurrency smoke; reports numbers, never gates a merge",
    "ui: Playwright dashboard smoke",
    "slow: excluded from the PR gate by time cost, not by value",
    # Priority tiers. Exactly one per test, enforced in tests/conftest.py.
    "p0: the service is doing its core job wrong. Read this failure first",
    "p1: a real defect with a narrower blast radius, or a specific edge",
    "p2: worth having, not worth blocking on",
]
# Warnings are errors: a DeprecationWarning from the service under test is a
# finding, not noise. Third-party warnings we cannot fix are listed explicitly
# so that the list itself documents the known dust.
filterwarnings = [
    "error",
    # starlette 1.6 nudges towards httpx2; the service pins httpx via its own deps
    # and the TestClient works correctly. Not ours to fix, so ignored by exact message.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:schemathesis.*",
    "ignore::DeprecationWarning:_pytest.*",
    # schemathesis' ASGI transport leaves anyio memory streams for the collector.
    # Escalated to an error by the rule above, the resulting ResourceWarning is
    # reported against whichever test happens to trigger GC — i.e. it fails a
    # random *unrelated* test. Suppressed at the source module rather than
    # globally, so a resource leak anywhere else is still an error.
    "ignore::ResourceWarning:anyio.streams.memory",
]
# xunit1 so that per-test properties survive into the XML: tests/conftest.py stamps
# each test's resolved priority tier there, and tools/test_report.py reads it back.
# That keeps one resolution point rather than re-deriving tiers from source.
junit_family = "xunit1"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# Coverage is measured over the service, not over the tests: the number we care
# about is "how much of the SUT did this suite actually exercise". Coverage of
# test code measures nothing.
source = ["service/app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["service"]  # not ours to lint

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "PT", "RUF"]
ignore = [
    "ANN401",  # typing.Any is legitimate for JSON payloads
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # `assert False` is fine in test scaffolding
# test_report.py embeds the report's CSS, HTML and JS as string templates. Wrapping
# those lines to 100 columns would either inject whitespace into the output or make
# the templates harder to read than the limit is worth.
"tools/test_report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["tests", "tools"]
strict = true
# The service is third-party code from our point of view: type-check our tests
# against it, but do not demand annotations from it.
[[tool.mypy.overrides]]
module = ["app.*", "schemathesis.*", "jsonschema.*", "referencing.*"]
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_calls = false

# `@schema.parametrize()` is untyped upstream, so strict mode calls every test it
# decorates untyped. Scoped to the one module that uses it rather than relaxed
# globally.
[[tool.mypy.overrides]]
module = ["tests.contract.test_schemathesis_fuzz"]
disallow_untyped_decorators = false
